# Production / Local nginx security snippet for رستا دارو
# ------------------------------------------------------------------
# Merge into the server { } block (or include this file).
# On Local by Flywheel the live file is usually:
#   %APPDATA%/Local/run/<site>/conf/nginx/includes/restrictions.conf
# Redeploy this snippet on every host — Local may regenerate site.conf.

# Hide PHP version on FastCGI responses (also set expose_php=Off in php.ini).
# Place inside: location ~ \.php$ { ... }
#   fastcgi_hide_header X-Powered-By;

# Core WordPress secrets / junk
location ~* ^/(wp-config\.php|wp-config-sample\.php|readme\.html|license\.txt|composer\.(json|lock))$ {
	deny all;
	return 404;
}

# Theme / plugin maintenance tools — never web-executable
location ~* /wp-content/themes/.*/tools/ {
	deny all;
	return 404;
}
location ~* /wp-content/plugins/.*/tools/ {
	deny all;
	return 404;
}

# Backup / temp artefacts under the docroot
location ~* \.(?:bak|sql|log|env)$ {
	deny all;
	return 404;
}

# HSTS belongs on the HTTPS production vhost only, e.g.:
#   add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
